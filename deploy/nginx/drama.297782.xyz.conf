# 让我演一集 — drama.297782.xyz
# 注意：不要用 /root/... 作 root，nginx 用户读不到会触发 try_files 死循环
# 推荐：/var/www/drama/dist 或 /root/workdir/pwa/drama/dist 但需 chmod 755 + chown

# HTTP → HTTPS（certbot 会维护此块，也可手动写）
server {
    listen 80;
    listen [::]:80;
    server_name drama.297782.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drama.297782.xyz;

    # 构建产物 — 若暂放 /root 下，见 DEPLOY.md「权限修复」
    root /var/www/drama/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/drama.297782.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drama.297782.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location ~ ^/(actuator|\.env|\.git|wp-admin|wp-login|phpmyadmin|administrator) {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /pwa-192.png {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /pwa-512.png {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /logo.jpg {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location ~ ^/workbox-[\w-]+\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        try_files /index.html =404;
    }
}
